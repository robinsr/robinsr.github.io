<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="">
  <meta name="author" content="">
  <link rel="shortcut icon" href="../../assets/ico/favicon.png">
  <script type="text/javascript" src="jquery-1.8.3.min.js"></script>
  <!--<script src="underscore.js"></script>-->

  <title>Demos &middot; Ryan Robinson</title>

  <!-- Bootstrap core CSS -->
  <link href="//maxcdn.bootstrapcdn.com/bootstrap/3.3.4/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/font-awesome/css/font-awesome.css">

  <!-- HTML5 shim and Respond.js IE8 support of HTML5 elements and media queries -->
    <!--[if lt IE 9]>
      <script src="bootstrap-3.0.0/assets/js/html5shiv.js"></script>
      <script src="bootstrap-3.0.0/assets/js/respond.min.js"></script>
      <![endif]-->


      <style type="text/css">
      /* round icons */
        .fa-icon-circle{
          text-align: center;
          width: 162px;
          height: 162px;
          margin: 23px auto;
          border: 3px solid #333;
          border-radius: 50%;
          font-size: 6.4em;
          color: #333;
          -webkit-transition: all .2s ease;
          -moz-transition: all .2s ease;
          -ms-transition: all .2s ease;
          -o-transition: all .2s ease;
          transition: all .2s ease;
        }
        .fa-icon-circle:hover{
          font-size: 6.6em;
        }
      /* full screen header */
      html, body {
        height:100%;
      }
      div.header,
      div.footer {
        display: table;
        width: 100%;
        height: 100%;
      }
      div.half {
        height: 50%;
      }
      div.header {
        background: url('images/cafe2_m.jpg') no-repeat center center fixed; 

      }
      div.header h1 {
        font-size: 3em;
        font-weight: bold;
      }
      div.center-text {
        display: table-cell;
        vertical-align: middle;
        text-align: center;
      }

      /* demos */

      div.demos {
        margin-top:5%;
        margin-bottom: 5%;
      }

      /* latest-blog-posts */

      div.latest-blog {
        color: #fff;
        display: table;
        width: 100%;
        height: 500px;
        background: url('images/cafe3_m.jpg') no-repeat center center fixed; 
        text-shadow: 0px 1px 5px rgba(0, 0, 0, 0.4);
      }
      div.latest-blog .headline {
        margin-bottom: 40px;
      }
      div.latest-blog .container {
        text-align: left;
      }

      div.latest-blog .blog-post .title a {
        color: #fff;
        font-weight: bold;
      }

      /*various other fixes*/
      h6 {
        min-height: 40px;
      }
      h3 {
        text-decoration: underline;
      }
      .footer-goodies i {
        font-size: 22pt;
      }
      a > i {
        color: #333;
      }
      a > i:hover {
        text-decoration: none;
      }
      div.header,
      div.latest-blog {
        -webkit-background-size: cover;
        -moz-background-size: cover;
        -o-background-size: cover;
        background-size: cover;
      }
      </style>
    </head>

    <body>

    <div class="header">
      <div class="center-text">
        <h1>Projects and Demos</h1>
        <p class="lead">Ryan Robinson &middot; WebDev &middot; Seattle, WA</p>
      </div>
    </div>


      <div class="container demos">
        <div class="row">
          <div class="col-sm-12">
            <div class="demos-headline text-center">
              <h3>Check These Guys Out</h3>
            </div>
          </div>
        </div>
          <div class="row">
            <div class="col-md-4 col-sm-12">
              <div class="row">
                <div class="col-sm-12">
                  <div class="fa-icon-circle">
                    <div class="big icon-pencil"></div>
                  </div>
                </div>
                <div class="col-xs-8 col-xs-offset-2 text-center">
                  <h2>Wato CMS</h2>
                  <h6>NodeJS Blog Tool</h6>
                  <p><a class="btn btn-default btn-block" href="http://wato.ethernetbucket.com/">View Demo Blog</a></p>
                  <p><a class="btn btn-default btn-block" href="http://wato.ethernetbucket.com/auth">View Blog Tools<br />(click 'demo')</a></p>
                </div>
              </div>
            </div>
            <div class="col-md-4 col-sm-12">
              <div class="row">
                <div class="col-sm-12">
                  <div class="fa-icon-circle">
                    <div class="big icon-money"></div>
                  </div>
                </div>
                <div class="col-xs-8 col-xs-offset-2 text-center">
                  <h2>Tiny Budget</h2>
                  <h6>Personal Budget App</h6>
                  <p><a class="btn btn-default btn-block" href="http://robinsr-tiny-budget.herokuapp.com/">View Demo</a></p>
                </div>
              </div>
            </div>
            <div class="col-md-4 col-sm-12">
              <div class="row">
                <div class="col-sm-12">
                  <div class="fa-icon-circle">
                    <div class="big icon-calendar"></div>
                  </div>
                </div>
                <div class="col-xs-8 col-xs-offset-2 text-center">
                  <h2>Calendar</h2>
                  <h6>CSV Powered Calendar</h6>
                  <p><a class="btn btn-default btn-block" href="http://robinsr-calendar.herokuapp.com/">View Demo</a></p>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="latest-blog">
         <div class="center-text">
           <div class="headline">
             <h2>Latest Blog Posts</h2>
           </div>
           <div class="container blog-post-target" data-bind="foreach: posts">
            <div class="row">
              <div class="col-xs-12">
                <div class="blog-post">
                  <div class="title">
                    <a data-bind="attr: {href: location}, text: title"></a>
                  </div>
                  <div class="preview-text" data-bind="text: previewText"></div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div> 
      <div class="footer half">
        <div class="center-text">
          <h1>Interested?</h1>
          <p>
            <a href="/resume.html" class="btn btn-primary btn-lg">R&#0233;sum&#0233;</a>
            <a href="mailto:ryan.b.robinson@gmail.com" class="btn btn-primary btn-lg">Contact</a>
          </p>
          <div class="container">
            <div class="row">
              <div class="col-sm-6 col-sm-offset-3">
                <hr>
                <ul class="list-inline footer-goodies">
                  <li>
                    <a href="http://www.linkedin.com/pub/ryan-robinson/55/a22/b15" title="Im on LinkedIn">
                      <i class="icon-linkedin"></i>
                    </a>
                  </li>
                  <li>
                    <a href="http://www.github.com/robinsr" title="and GitHub too (obviously)">
                      <i class="icon-github"></i>
                    </a>
                  </li>
                </ul>
              </div>
            </div>
          </div>
        </div>
       </div>

      <script type="text/javascript" src="//cdnjs.cloudflare.com/ajax/libs/knockout/2.3.0/knockout-min.js"></script>
      <script type="text/javascript" src="//cdnjs.cloudflare.com/ajax/libs/knockout.mapping/2.3.5/knockout.mapping.js"></script>
      <!--<script src="backbone.js"></script>-->
      <script>
      var viewModel = function(){
        var self = this;
        self.posts = ko.mapping.fromJS([])
        $.get('http://www.ethernetbucket.com/article?limit=5',function(data){
          ko.mapping.fromJS(data,self.posts);
        })
      }
      ko.applyBindings(new viewModel());
      </script>
    </body>
    </html>
