layout: page

<section>
  
  <h2>Latest Articles</h2>

  {% for post in site.posts limit:4 %}

      <p>
        <a href="{{ post.url }}">{{ post.title }}</a>
      </p>
        
      <p>{{ post.excerpt | remove: '<p>' | remove: '</p>' }}<b>  [ </b><a href="{{ post.url }}" class="readmore">Read More...</a><b> ]</b></p>
        
    {% endfor %}

</section>
