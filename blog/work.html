---
layout: page
title: Work Experience
---

<section>
  <h2>Work Experience</h2>
  <ul>
    {% for job in site.work %}
    <li class="flex justify-between py-12">
      <a href="{{ job.url }}">{{ job.title }} at {{ job.company }}</a>
      <small class="text-sm text-gray-500 text-right whitespace-nowrap">
        <strong>{{ job.start_date | date: "%B %Y" }}</strong>
        <span class="text-[10px]">to</span>
        <strong>{{ job.end_date | date: "%B %Y" }}</strong>
      </small>
    </li>
    {% endfor %}
  </ul>
</section>
